apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintech-api
  labels:
    app: fintech-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fintech-api
  template:
    metadata:
      labels:
        app: fintech-api
    spec:
      containers:
      - name: api
        image: fintech-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql+asyncpg://fintech:fintech@postgres-service:5432/fintech"
        - name: RABBITMQ_URL
          value: "amqp://fintech:fintech@rabbitmq-service:5672/"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: fintech-api-service
spec:
  selector:
    app: fintech-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer