[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech_ledger"
version = "0.1.0"
description = "Core ledger infrastructure (double-entry bookkeeping)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pika>=1.3.0",
]

[project.scripts]
init-db = "fintech_ledger.scripts.init_db:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100